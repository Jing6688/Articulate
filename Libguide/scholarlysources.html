<video id="myVideo" autoplay playsinline style="width: 100%; height: auto;">
    <source src="scholarlysources.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<script>
var video = document.getElementById('myVideo');

video.addEventListener('play', function() {
    video.muted = false;  // Unmute once playback has begun
});

// Or only unmute when the parent sends the replay message
window.addEventListener('message', function(event) {
    if (event.data === 'replayVideo') {
        video.currentTime = 0;
        video.muted = false;
        video.play();
    }
});

</script>
